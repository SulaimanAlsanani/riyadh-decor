name: Publish Riyadh Decor
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: riyadh-decor-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and validate the site
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          if [[ -z "$PAGES_URL" ]]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            repo="${GITHUB_REPOSITORY#*/}"
            PAGES_URL="https://${owner,,}.github.io/$repo/"
          fi
          npm run build -- "$PAGES_URL"
          node scripts/check-export.mjs
          node scripts/preview.mjs
          printf '%s\n' "$GITHUB_SHA" > web-preview/revision.txt
      - name: Update the browser preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          publish_dir="$RUNNER_TEMP/riyadh-decor-preview"
          if git ls-remote --exit-code --heads origin web-preview >/dev/null; then
            git fetch origin refs/heads/web-preview
            git worktree add --detach "$publish_dir" FETCH_HEAD
            git -C "$publish_dir" rm -rf --ignore-unmatch .
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" rm -rf --ignore-unmatch .
          fi
          cp -a web-preview/. "$publish_dir/"
          git -C "$publish_dir" add -A
          if git -C "$publish_dir" diff --cached --quiet; then exit 0; fi
          git -C "$publish_dir" commit -m "Publish preview for ${GITHUB_SHA:0:12}"
          git -C "$publish_dir" push origin HEAD:refs/heads/web-preview
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        id: setup
        continue-on-error: true
      - name: Publish GitHub Pages
        if: steps.setup.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report Pages setup requirement
        if: steps.setup.outcome != 'success'
        run: echo 'Enable GitHub Actions under Settings → Pages to publish GitHub Pages. The web-preview branch was updated.'
